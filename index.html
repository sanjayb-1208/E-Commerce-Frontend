<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="amazon.css">
</head>
<body>
    <div class="header-container">
        <div class="logo-container">
            <img src="./images/kmart-logo-black-and-white.png" class="logo">
        </div>
        
        <div class="title-container">
            <h1 class="title">K-Mart</h1>
        </div>
        <div class="search-box-container">
            <input type="text" placeholder="Search for Product" class="search-box">
            <div class="search-button-container">
                <button class="search-button">
                    <img src="images/search-icon.png" class="search-icon">
                </button>
            </div>
        </div>
        <a href="checkout.html">
        <div class="cart-container">
            <h1 class="cart">Cart</h1>
            <div class="cart-quantity-container">
                <p class="cart-quantity"></p>
            </div>
        </div>
        </a>
    </div>
    <div class="products-container">
        <a>
        <div class="product">
            <div class="image-container">
                <img src="images/420-445-rabona-pro-5-22-1-fb-80075l-football-nivia-original-imaghjjn9puy3xwr.webp" alt="">
            </div>
            <div class="product-details-container">
                <h4 class="product-name">Nike Football 45cm for Men</h4>
                <div class="product-price-container">
                    <h5 class="product-discount">10%</h5>
                    <p class="product-price">$45</p>
                    <p class="product-original-price">
                        <strike>$100</strike>                        
                    </p>
                </div>
                <div class="product-ratings-container">
                    <p class="product-ratings">Ratings : 4.5/5</p>
                    <p class="product-ratings-count">2401 reviews</p>
                </div>
                
                <div class="buy-button-container">
                    <p class="added-show">Added</p>
                    <button class="buy-button">Buy</button>
                    <button class="add-to-cart-button">Add to Cart</button>
                </div>
                
                
            </div>
        
        </div>
        </a>
    </div>

    <script type="module" src="amazon.js"></script>
</body>
</html>
