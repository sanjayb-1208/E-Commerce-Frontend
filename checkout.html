<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="checkout.css">
</head>

<body>
    <div class="header-container">
        <a href="index.html"><div class="logo-container">
            <img class="logo" src="./images/kmart-logo-black-and-white.png" alt="Logo">
        </div>
        </a>

        <div class="title-container">
            <h1 class="title">K-Mart</h1>
        </div>
        </a>
    </div>


    <div class="checkout-page-container">
        <div class="selected-products">

        </div>
        <div class="bill-container">
            <div class="single-line">
                <p class="c1">No. of Items</p>
                <h3 class="c2">Items(2) : </h3>
                <h3 class="c3">$50</h3>
            </div>
            <div class="single-line">
                <p class="c1">OriginalPrice</p>
                <h3 class="c2">Price : </h3>
                <h3 class="c3"><strike>$150</strike></h3>
            </div>
            <div class="single-line">
                <p class="c1">Price for Delivery</p>
                <h3 class="c2">Free Delivery: </h3>
                <h3 class="c3">$0</h3>
            </div>
            <hr>
            <div class="single-line">
                <p class="c1">Total amount</p>
                <h3 class="c2">Total : </h3>
                <h3 class="c3">$50</h3>
            </div>

        </div>
    </div>

    <script src="checkout.js" type="module"></script>
</body>

</html>
